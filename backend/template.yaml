AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Real-time auction backend - API Gateway WebSocket + Lambda (Python) + DynamoDB

Parameters:
  StageName:
    Type: String
    Default: dev
  AllowedOrigin:
    Type: String
    Default: "*"
    Description: CORS origin for the HTTP API and image uploads (set to your Amplify URL in production)
  AuthMode:
    Type: String
    Default: dev
    AllowedValues: [dev, cognito, supabase]
    Description: >-
      Identity source. 'cognito' = the user pool below (real accounts).
      'dev' = passwordless test logins (anyone can be anyone; local work and demos only).
      'supabase' is not implemented (see src/auction/auth.py).
  DevAuthSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: HMAC secret for AUTH_MODE=dev tokens (at least 16 characters)
  AdminEmails:
    Type: String
    Default: ""
    Description: Comma-separated emails that are admins (approve buyers/sellers)
  NotifyFrom:
    Type: String
    Default: ""
    Description: >-
      SES-verified sender for notification emails, e.g. "BidBloom <alerts@example.com>".
      Empty = emails are only logged.
  SiteUrl:
    Type: String
    Default: ""
    Description: Public site URL, used for links in emails (e.g. https://main.xxxx.amplifyapp.com)

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: src/
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        AUCTIONS_TABLE: !Ref AuctionsTable
        BIDS_TABLE: !Ref BidsTable
        CONNECTIONS_TABLE: !Ref ConnectionsTable
        USERS_TABLE: !Ref UsersTable
        SAVES_TABLE: !Ref SavesTable
        AUTH_MODE: !Ref AuthMode
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        DEV_AUTH_SECRET: !Ref DevAuthSecret
        ADMIN_EMAILS: !Ref AdminEmails

Resources:
  # ------------------------------------------------------------------ DynamoDB
  AuctionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: auctionId, AttributeType: S }
        - { AttributeName: listing, AttributeType: S }
        - { AttributeName: category, AttributeType: S }
        - { AttributeName: sellerId, AttributeType: S }
        - { AttributeName: createdAt, AttributeType: N }
        - { AttributeName: openListing, AttributeType: S }
        - { AttributeName: endsAt, AttributeType: N }
      KeySchema:
        - { AttributeName: auctionId, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: byListing
          KeySchema:
            - { AttributeName: listing, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: byCategory
          KeySchema:
            - { AttributeName: category, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: bySeller
          KeySchema:
            - { AttributeName: sellerId, KeyType: HASH }
            - { AttributeName: createdAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        # Open auctions only (openListing is removed on close/cancel), soonest end first.
        - IndexName: byEnding
          KeySchema:
            - { AttributeName: openListing, KeyType: HASH }
            - { AttributeName: endsAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  BidsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: auctionId, AttributeType: S }
        - { AttributeName: bidId, AttributeType: S }
        - { AttributeName: amount, AttributeType: N }
        - { AttributeName: bidderId, AttributeType: S }
        - { AttributeName: placedAt, AttributeType: N }
      KeySchema:
        - { AttributeName: auctionId, KeyType: HASH }
        - { AttributeName: bidId, KeyType: RANGE }
      LocalSecondaryIndexes:
        - IndexName: byAmount
          KeySchema:
            - { AttributeName: auctionId, KeyType: HASH }
            - { AttributeName: amount, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      GlobalSecondaryIndexes:
        - IndexName: byBidder
          KeySchema:
            - { AttributeName: bidderId, KeyType: HASH }
            - { AttributeName: placedAt, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ConnectionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: connectionId, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
        - { AttributeName: auctionId, AttributeType: S }
      KeySchema:
        # sk = META (who is connected) or SUB#<auctionId> (one row per followed auction)
        - { AttributeName: connectionId, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: byAuction
          KeySchema:
            - { AttributeName: auctionId, KeyType: HASH }
          Projection: { ProjectionType: KEYS_ONLY }
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Saved ("watched") auctions; the auction row keeps a denormalised watchCount.
  SavesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: userId, AttributeType: S }
        - { AttributeName: auctionId, AttributeType: S }
      KeySchema:
        - { AttributeName: userId, KeyType: HASH }
        - { AttributeName: auctionId, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: byAuction
          KeySchema:
            - { AttributeName: auctionId, KeyType: HASH }
            - { AttributeName: userId, KeyType: RANGE }
          Projection: { ProjectionType: KEYS_ONLY }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ------------------------------------------------------------------ Accounts (AUTH_MODE=cognito)
  # The browser calls Cognito directly for sign-up, sign-in and password resets
  # (USER_PASSWORD_AUTH over TLS); the backend only verifies the resulting ID token.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireUppercase: false
          RequireSymbols: false
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your BidBloom verification code
        EmailMessage: "Your BidBloom verification code is {####}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  # ------------------------------------------------------------------ Images (private; served via signed URLs)
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [POST]
            AllowedHeaders: ["*"]
            MaxAge: 3000
      # Uploads reach the thumbnail function through EventBridge (no bucket -> function
      # reference, which would be a dependency cycle with the function's policy).
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  # ------------------------------------------------------------------ WebSocket API
  WebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-ws"
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: "$request.body.action"

  WebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref WebSocketApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub "arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${WebSocketFunction.Arn}/invocations"

  ConnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $connect
      Target: !Sub "integrations/${WebSocketIntegration}"
  DisconnectRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $disconnect
      Target: !Sub "integrations/${WebSocketIntegration}"
  DefaultRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: $default
      Target: !Sub "integrations/${WebSocketIntegration}"
  SubscribeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: subscribe
      Target: !Sub "integrations/${WebSocketIntegration}"
  PlaceBidRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: placeBid
      Target: !Sub "integrations/${WebSocketIntegration}"
  PingRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: ping
      Target: !Sub "integrations/${WebSocketIntegration}"
  WatchRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref WebSocketApi
      RouteKey: watch
      Target: !Sub "integrations/${WebSocketIntegration}"

  # Renamed whenever routes change, so CloudFormation creates a fresh deployment.
  WebSocketDeploymentV2:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: [ConnectRoute, DisconnectRoute, DefaultRoute, SubscribeRoute, PlaceBidRoute, PingRoute, WatchRoute]
    Properties:
      ApiId: !Ref WebSocketApi

  WebSocketStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref WebSocketApi
      StageName: !Ref StageName
      DeploymentId: !Ref WebSocketDeploymentV2
      DefaultRouteSettings:
        ThrottlingBurstLimit: 500
        ThrottlingRateLimit: 1000

  WebSocketInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref WebSocketFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  # ------------------------------------------------------------------ Functions
  WebSocketFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.ws.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuctionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BidsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - Statement:
            # Bids read the bidder's account and ConditionCheck its approval in the transaction.
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:ConditionCheckItem]
              Resource: !GetAtt UsersTable.Arn
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"

  BroadcastFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.stream.handler
      Timeout: 60
      Environment:
        Variables:
          WS_ENDPOINT: !Sub "https://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref ConnectionsTable }
        - Statement:
            - Effect: Allow
              Action: execute-api:ManageConnections
              Resource: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApi}/*"
      Events:
        AuctionChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AuctionsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 25
            MaximumBatchingWindowInSeconds: 0
            MaximumRetryAttempts: 3
            BisectBatchOnFunctionError: true

  HttpFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.http.handler
      Environment:
        Variables:
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
          CLOSE_FUNCTION_ARN: !GetAtt CloseAuctionFunction.Arn
          NOTIFY_FUNCTION_ARN: !GetAtt NotifyFunction.Arn
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuctionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BidsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SavesTable }
        - S3CrudPolicy: { BucketName: !Ref ImagesBucket }
        - Statement:
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule, scheduler:DeleteSchedule]
              Resource:
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/close-*"
                - !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/remind-*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn
      Events:
        # Routing happens in handlers/http.py, so new endpoints don't need template changes.
        Api:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: "/{proxy+}", Method: ANY }

  CloseAuctionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.scheduler.handler
      Timeout: 90
      Environment:
        Variables:
          # To re-schedule itself when last-minute bids extend an auction.
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AuctionsTable }
        - Statement:
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:UpdateSchedule]
              Resource: !Sub "arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/close-*"
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerInvokeRole.Arn

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.notify.handler
      Timeout: 120
      Environment:
        Variables:
          NOTIFY_FROM: !Ref NotifyFrom
          SITE_URL: !Ref SiteUrl
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref AuctionsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BidsTable }
        - DynamoDBReadPolicy: { TableName: !Ref UsersTable }
        - DynamoDBReadPolicy: { TableName: !Ref SavesTable }
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: "*"
      Events:
        AuctionChanges:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt AuctionsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 25
            MaximumBatchingWindowInSeconds: 1
            MaximumRetryAttempts: 2
            BisectBatchOnFunctionError: true

  ThumbnailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: thumbs/
      Handler: app.handler
      Timeout: 30
      MemorySize: 1024
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - S3CrudPolicy: { BucketName: !Ref ImagesBucket }
      Events:
        Uploaded:
          Type: EventBridgeRule
          Properties:
            Pattern:
              source: [aws.s3]
              detail-type: [Object Created]
              detail:
                bucket: { name: [!Ref ImagesBucket] }
                object: { key: [{ prefix: uploads/ }] }

  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: invoke-scheduled-functions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # By name pattern rather than !GetAtt: the close function passes this role
              # when it re-schedules itself, and a direct reference would be a cycle.
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-*"

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]

Outputs:
  WebSocketUrl:
    Description: Set as NEXT_PUBLIC_WS_URL in the frontend
    Value: !Sub "wss://${WebSocketApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}"
  HttpApiUrl:
    Description: Set as NEXT_PUBLIC_API_URL in the frontend
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  UserPoolId:
    Description: Set as NEXT_PUBLIC_COGNITO_USER_POOL_ID in the frontend
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Set as NEXT_PUBLIC_COGNITO_CLIENT_ID in the frontend
    Value: !Ref UserPoolClient
